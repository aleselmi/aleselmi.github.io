    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f8fafc;
        }


        /* ================================
           COLORI PRINCIPALI
           ================================ */

        .navy-bg {
            background-color: #0b2a4a;
        }

        .navy-text {
            color: #0b2a4a;
        }


        /* ================================
           CARD FUNZIONI
           ================================ */

        .function-card {
            background-color: white;
            border-radius: 16px;
            overflow: hidden;

            box-shadow:
                0 4px 12px rgba(11, 42, 74, 0.12);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .function-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(11, 42, 74, 0.18);
        }


        /* ================================
           ZONA GRAFICO
           ================================ */

        .graph-area {

            height: 230px;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #ffffff;

            padding: 20px;
        }


        /* ================================
           TITOLO CARD
           ================================ */

        .function-title {

            border-top: 1px solid #e2e8f0;

            padding: 18px;

            text-align: center;

            font-size: 1.25rem;
            font-weight: 700;

            color: #0b2a4a;
        }


        /* ================================
           GRAFICO SVG
           ================================ */

        .graph-svg {

            width: 100%;
            height: 100%;

            max-width: 260px;
        }


        .axis {

            stroke: #64748b;
            stroke-width: 1.5;
        }


        .grid-line {

            stroke: #e2e8f0;
            stroke-width: 1;
        }


        .linear-function {

            stroke: #0b2a4a;
            stroke-width: 3;

            fill: none;

            stroke-linecap: round;
        }


        .inverse-function {

            stroke: #0b2a4a;
            stroke-width: 3;

            fill: none;

            stroke-linecap: round;
        }


        .axis-label {

            fill: #475569;

            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
        }


    </style>

</head>

        <!-- ==============================

        <a href="FunzioneLineare.html"
           class="function-card block no-underline">


            <div class="graph-area">


                <svg class="graph-svg"
                     viewBox="0 0 260 200"
                     xmlns="http://www.w3.org/2000/svg">


                    <!-- GRIGLIA VERTICALE -->

                    <line x1="30" y1="20"

                          class="grid-line"/>

                    <line x1="80" y1="20"
                          x2="80" y2="180"
                          class="grid-line"/>

                    <line x1="130" y1="20"

                    <!-- GRIGLIA ORIZZONTALE -->

                    <line x1="20" y1="40"
                          x2="240" y2="40"
                          class="grid-line"/>

                    <line x1="20" y1="80"
                          x2="240" y2="80"
                          class="grid-line"/>

                    <line x1="20" y1="120"
                          x2="240" y2="120"
                          class="grid-line"/>

                    <line x1="20" y1="160"
                          x2="240" y2="160"
                          class="grid-line"/>


                    <!-- ASSE X -->

                    <line x1="20" y1="120"
                          x2="240" y2="120"
                          class="axis"/>


                    <polyline

                        x

                    <text x="140"
                          y="32"
                          class="axis-label">
                        f(x)

                    <!-- RETTA -->

                          x2="205"
                          y2="45"

                </svg>


            </div>
