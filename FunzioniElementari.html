<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Funzioni elementari · Alessia Selmi</title>

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f8fafc;
        }


        /* ================================
           COLORI PRINCIPALI
           ================================ */

        .navy-bg {
            background-color: #0b2a4a;
        }

        .navy-text {
            color: #0b2a4a;
        }


        /* ================================
           CARD FUNZIONI
           ================================ */

        .function-card {
            background-color: white;
            border-radius: 16px;
            overflow: hidden;

            box-shadow:
                0 4px 12px rgba(11, 42, 74, 0.12);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .function-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(11, 42, 74, 0.18);
        }


        /* ================================
           ZONA GRAFICO
           ================================ */

        .graph-area {

            height: 230px;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #ffffff;

            padding: 20px;
        }


        /* ================================
           TITOLO CARD
           ================================ */

        .function-title {

            border-top: 1px solid #e2e8f0;

            padding: 18px;

            text-align: center;

            font-size: 1.25rem;
            font-weight: 700;

            color: #0b2a4a;
        }


        /* ================================
           GRAFICO SVG
           ================================ */

        .graph-svg {

            width: 100%;
            height: 100%;

            max-width: 260px;
        }


        .axis {

            stroke: #64748b;
            stroke-width: 1.5;
        }


        .grid-line {

            stroke: #e2e8f0;
            stroke-width: 1;
        }


        .linear-function {

            stroke: #0b2a4a;
            stroke-width: 3;

            fill: none;

            stroke-linecap: round;
        }


        .inverse-function {

            stroke: #0b2a4a;
            stroke-width: 3;

            fill: none;

            stroke-linecap: round;
        }


        .axis-label {

            fill: #475569;

            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
        }


    </style>

</head>



<body class="text-gray-800">


<!-- ======================================
     HEADER
     ====================================== -->

<header class="navy-bg text-white py-10 shadow-lg">


    <!-- HOME -->

    <a href="index.html"

       class="inline-block ml-6 mb-4 px-4 py-2
              bg-white text-[#0b2a4a] font-semibold
              rounded-lg shadow
              hover:bg-gray-100 transition">

        ← Home

    </a>



    <div class="container mx-auto px-4 text-center">


        <h1 class="text-4xl font-extrabold mb-2">

            Funzioni elementari

        </h1>


        <p class="text-xl opacity-90">

            Grafici e caratteristiche delle principali funzioni elementari

        </p>


    </div>


</header>



<!-- ======================================
     CONTENUTO
     ====================================== -->

<main class="container mx-auto px-4 py-12 max-w-5xl">


    <!-- ==================================
         GRIGLIA DELLE FUNZIONI
         ================================== -->

    <div class="grid grid-cols-1
                sm:grid-cols-2
                lg:grid-cols-3
                gap-8">



        <!-- ==============================
             FUNZIONE LINEARE
             ============================== -->

        <a href="FunzioneLineare.html"
           class="function-card block no-underline">


            <div class="graph-area">


                <svg class="graph-svg"
                     viewBox="0 0 260 200"
                     xmlns="http://www.w3.org/2000/svg">


                    <!-- GRIGLIA VERTICALE -->

                    <line x1="30" y1="20"
                          x2="30" y2="180"
                          class="grid-line"/>

                    <line x1="80" y1="20"
                          x2="80" y2="180"
                          class="grid-line"/>

                    <line x1="130" y1="20"
                          x2="130" y2="180"
                          class="grid-line"/>

                    <line x1="180" y1="20"
                          x2="180" y2="180"
                          class="grid-line"/>

                    <line x1="230" y1="20"
                          x2="230" y2="180"
                          class="grid-line"/>


                    <!-- GRIGLIA ORIZZONTALE -->

                    <line x1="20" y1="40"
                          x2="240" y2="40"
                          class="grid-line"/>

                    <line x1="20" y1="80"
                          x2="240" y2="80"
                          class="grid-line"/>

                    <line x1="20" y1="120"
                          x2="240" y2="120"
                          class="grid-line"/>

                    <line x1="20" y1="160"
                          x2="240" y2="160"
                          class="grid-line"/>


                    <!-- ASSE X -->

                    <line x1="20" y1="120"
                          x2="240" y2="120"
                          class="axis"/>


                    <polyline
                        points="233,115 240,120 233,125"
                        fill="none"
                        class="axis"/>


                    <!-- ASSE Y -->

                    <line x1="130" y1="180"
                          x2="130" y2="20"
                          class="axis"/>


                    <polyline
                        points="125,27 130,20 135,27"
                        fill="none"
                        class="axis"/>


                    <!-- LETTERE ASSI -->

                    <text x="228"
                          y="110"
                          class="axis-label">
                        x
                    </text>


                    <text x="140"
                          y="32"
                          class="axis-label">
                        f(x)
                    </text>


                    <!-- RETTA -->

                    <line x1="55"
                          y1="170"
                          x2="205"
                          y2="45"
                          class="linear-function"/>


                </svg>


            </div>


            <div class="function-title">

                Funzione lineare

            </div>


        </a>



        <!-- ==============================
             PROPORZIONALITÀ INVERSA
             ============================== -->

        <a href="ProporzionalitaInversa.html"
           class="function-card block no-underline">


            <div class="graph-area">


                <svg class="graph-svg"
                     viewBox="0 0 260 200"
                     xmlns="http://www.w3.org/2000/svg">


                    <!-- GRIGLIA VERTICALE -->

                    <line x1="30" y1="20"
                          x2="30" y2="180"
                          class="grid-line"/>

                    <line x1="80" y1="20"
                          x2="80" y2="180"
                          class="grid-line"/>

                    <line x1="130" y1="20"
                          x2="130" y2="180"
                          class="grid-line"/>

                    <line x1="180" y1="20"
                          x2="180" y2="180"
                          class="grid-line"/>

                    <line x1="230" y1="20"
                          x2="230" y2="180"
                          class="grid-line"/>


                    <!-- GRIGLIA ORIZZONTALE -->

                    <line x1="20" y1="40"

                          class="grid-line"/>

                    <line x1="20" y1="80"
                          x2="240" y2="80"
                          class="grid-line"/>

                    <line x1="20" y1="120"

                    <line x1="20" y1="160"

                    <!-- ASSE X -->

                    <line x1="20" y1="100"
                          x2="240" y2="100"
                          class="axis"/>


                    <polyline
                        points="233,95 240,100 233,105"
                        fill="none"
                        class="axis"/>


                    <!-- ASSE f(x) -->

                    <line x1="130" y1="180"
                          x2="130" y2="20"
                          class="axis"/>


                    <polyline
                        points="125,27 130,20 135,27"
                        fill="none"
                        class="axis"/>


                    <!-- LETTERE ASSI -->

                    <text x="228"
                          y="90"
                          class="axis-label">
                        x
                    </text>


                    <text x="140"
                          y="32"
                          class="axis-label">
                        f(x)
                    </text>


                    <!-- ======================
                         IPERBOLE
                         ====================== -->


                    <!-- RAMO I QUADRANTE -->

                    <path
                        d="
                        M 140 25
                        C 142 45, 146 62, 153 73
                        C 162 84, 177 91, 195 95
                        C 210 97, 225 98, 238 98
                        "
                        class="inverse-function"/>


                    <!-- RAMO III QUADRANTE -->

                    <path
                        d="
                        M 22 102
                        C 35 102, 50 103, 65 105
                        C 83 109, 98 116, 107 127
                        C 114 138, 118 155, 120 175
                        "
                        class="inverse-function"/>


                </svg>


            </div>


            <div class="function-title">

                Proporzionalità inversa

            </div>


        </a>


    </div>


</main>
