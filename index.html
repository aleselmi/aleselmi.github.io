<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matematica - Alessia Selmi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eaf5ff;
            color: #123b7a;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 25px 80px;
        }

        /* TITOLO */

        header {
            text-align: center;
            margin-bottom: 65px;
        }

        header h1 {
            margin: 0;
            font-size: 48px;
            color: #123b7a;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
            color: #2870c7;
        }

        /* SEZIONE */

        h2 {
            font-size: 28px;
            border-left: 5px solid #4da3ff;
            padding-left: 15px;
            margin-bottom: 30px;
        }

        /* CARD */

        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: white;
            color: #123b7a;

            padding: 24px 20px;
            margin-bottom: 20px;

            border-radius: 14px;

            text-decoration: none;
            font-size: 20px;
            font-weight: 500;

            box-shadow: 0 2px 8px rgba(20, 70, 120, 0.05);

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(20, 70, 120, 0.12);
        }

        .freccia {
            color: #4da3ff;
            font-size: 24px;
        }

        /* TELEFONO */

        @media (max-width: 600px) {

            header h1 {
                font-size: 38px;
            }

            .container {
                padding: 30px 18px;
            }

            .card {
                font-size: 18px;
            }
        }
    </style>
</head>

<div class="container">
